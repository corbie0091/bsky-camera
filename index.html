<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#053ca3">
  <title>비스카이 사진 촬영</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#eef3fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
    .app{width:min(100%,560px);min-height:100dvh;margin:auto;background:white;display:flex;flex-direction:column}
    header{background:linear-gradient(120deg,#053ca3,#2584f0);color:#fff;padding:18px 20px}
    .brand{font-size:22px;font-weight:850;letter-spacing:-.6px}.subtitle{font-size:13px;opacity:.9;margin-top:4px}
    main{padding:18px;flex:1;display:flex;flex-direction:column}.heading{font-size:16px;font-weight:750;margin:0 0 12px}
    .view{position:relative;width:100%;aspect-ratio:3/4;max-height:65dvh;overflow:hidden;background:#121c2c;border-radius:16px;display:flex;align-items:center;justify-content:center}
    video,img{width:100%;height:100%;object-fit:contain} video[hidden],img[hidden],[hidden]{display:none!important}
    .overlay{position:absolute;inset:0;color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:#182639;gap:12px;line-height:1.6;font-size:14px}
    .overlay svg{opacity:.85}.overlay p{margin:0}.overlay button{min-height:44px;background:#fff;color:#053ca3}
    button{border:0;border-radius:12px;min-height:52px;padding:0 14px;font-size:15px;font-weight:750;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .capture{grid-column:1/-1;color:#fff;background:#2584f0}.save{color:white;background:#053ca3}.share{color:white;background:#2584f0}.retake{grid-column:1/-1;color:#344054;background:#eef2f7;min-height:44px}
    .status{min-height:20px;font-size:13px;line-height:1.5;color:#475467;text-align:center;margin:12px 0 0}.tip{font-size:12px;line-height:1.6;color:#667085;margin:12px 2px 0}
    footer{text-align:center;padding:14px;border-top:1px solid #f0f2f5;color:#98a2b3;font-size:11px}
    dialog{border:0;border-radius:18px;padding:24px;width:min(90%,380px);box-shadow:0 16px 48px #0004;text-align:center;color:#172033}dialog::backdrop{background:#0009}dialog h2{font-size:19px;margin:0 0 10px}dialog p{font-size:14px;line-height:1.6;color:#475467}.dialog-actions{display:flex;gap:10px;margin-top:18px}.dialog-actions button{flex:1}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand">비스카이</div><div class="subtitle">현장 사진 촬영 및 저장</div></header>
  <main>
    <p class="heading" id="heading">촬영할 대상을 화면에 맞춰 주세요</p>
    <div class="view">
      <video id="video" autoplay muted playsinline aria-label="카메라 미리보기"></video>
      <img id="preview" alt="로고가 삽입된 촬영 사진 미리보기" hidden>
      <div class="overlay" id="overlay">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <p id="overlayText">카메라를 연결하고 있습니다.<br>권한 요청이 나타나면 허용해 주세요.</p>
        <button type="button" id="retry" hidden>카메라 다시 연결</button>
        <button type="button" id="fallback" hidden>기기 카메라로 촬영</button>
      </div>
    </div>
    <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
    <div class="actions">
      <button type="button" class="capture" id="capture" disabled>사진 촬영하기</button>
      <button type="button" class="save" id="save" hidden>저장하기</button>
      <button type="button" class="share" id="share" hidden>카카오톡 공유하기</button>
      <button type="button" class="retake" id="retake" hidden>다시 촬영</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="tip">촬영한 사진에 비스카이 로고가 표시되며, JPEG 400KB 이하로 자동 조정됩니다.<br>저장하기를 누르면 사진이 다운로드됩니다. 저장 위치는 기기와 브라우저에 따라 다를 수 있습니다. 카카오톡 공유를 누르면 사진이 카카오 서버에 업로드됩니다.</p>
  </main>
  <footer>BSKY · 현장 사진 관리</footer>
</div>
<dialog id="saveDialog" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle">사진 저장 요청</h2>
  <p id="dialogMessage">다운로드를 시작했습니다. 갤러리 또는 내 파일의 다운로드 폴더에서 사진을 확인해 주세요.</p>
  <div class="dialog-actions"><button type="button" class="save" id="confirmPhoto">확인하기</button><button type="button" class="retake" id="closeDialog">닫기</button></div>
</dialog>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js" integrity="sha384-BGX7Wb16GmRFagri4bLJV2DgipVZaU2AI812GZtHtHzzDQJnfHasDXN5houxv45w" crossorigin="anonymous"></script>
<script>
  // 카카오디벨로퍼스 JavaScript 키를 입력하세요. 어드민 키를 입력하지 마세요.
  const KAKAO_JAVASCRIPT_KEY='ad12e3ada32a21b0674b429cd22920b2';
  const MAX_BYTES=400*1024;
  const $=id=>document.getElementById(id);
  const video=$('video'), preview=$('preview'), overlay=$('overlay'), overlayText=$('overlayText');
  const capture=$('capture'), save=$('save'), share=$('share'), retake=$('retake'), retry=$('retry'), fallback=$('fallback'), input=$('cameraInput'), statusEl=$('status');
  let stream=null, photo=null, photoUrl=null, starting=false, capturedAt=null, kakaoImageUrl=null;
  async function startCamera(){
    if(starting || (stream && stream.active)) return;
    starting=true; capture.disabled=true; retry.hidden=true; fallback.hidden=true; overlay.hidden=false;
    overlayText.innerHTML='카메라를 연결하고 있습니다.<br>권한 요청이 나타나면 허용해 주세요.';
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
      try { stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
      catch(e){ if(e.name==='OverconstrainedError') stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); else throw e; }
      video.srcObject=stream; await video.play(); overlay.hidden=true; capture.disabled=false;
      statusEl.textContent='';
    }catch(e){
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
      let message='카메라를 연결하지 못했습니다. 다시 연결하거나 기기 카메라를 이용해 주세요.';
      if(!window.isSecureContext) message='카메라를 사용하려면 HTTPS 주소로 접속해 주세요.';
      else if(e.name==='NotAllowedError' || e.name==='SecurityError') message='카메라 접근이 허용되지 않았습니다. 브라우저 또는 기기 설정에서 카메라 권한을 허용해 주세요.';
      else if(e.name==='NotFoundError') message='사용할 수 있는 카메라를 찾지 못했습니다.';
      overlayText.textContent=message; retry.hidden=false; fallback.hidden=false;
    }finally{starting=false;}
  }
  async function processImage(source,width,height){
    capturedAt=new Date();
    capture.disabled=true; statusEl.textContent='사진을 처리하고 있습니다...';
    try {
      const result=await compress(source,width,height);
      photo=new File([result.blob],'bsky-photo.jpg',{type:'image/jpeg'});
      if(photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl=URL.createObjectURL(photo); preview.src=photoUrl; preview.hidden=false; video.hidden=true; overlay.hidden=true;
      capture.hidden=true; save.hidden=false; share.hidden=false; retake.hidden=false;
      $('heading').textContent='사진을 확인해 주세요';
      statusEl.textContent=`JPEG · ${(photo.size/1024).toFixed(1)}KB · ${result.width} × ${result.height}px`;
    } catch(e){console.error(e);statusEl.textContent='사진 처리에 실패했습니다. 다시 촬영해 주세요.';capture.disabled=!stream;}
  }
  capture.addEventListener('click',()=>{
    if(!video.videoWidth || !video.videoHeight){statusEl.textContent='카메라가 준비될 때까지 잠시 기다려 주세요.';return;}
    processImage(video,video.videoWidth,video.videoHeight);
  });
  retry.addEventListener('click',startCamera);
  fallback.addEventListener('click',()=>{input.value='';input.click();});
  input.addEventListener('change',()=>{
    const file=input.files && input.files[0]; if(!file) return;
    const url=URL.createObjectURL(file), image=new Image();
    image.onload=()=>{URL.revokeObjectURL(url);processImage(image,image.naturalWidth,image.naturalHeight);};
    image.onerror=()=>{URL.revokeObjectURL(url);statusEl.textContent='사진을 불러오지 못했습니다. 다시 시도해 주세요.';}; image.src=url;
  });
  function showMessage(title,message){
    $('dialogTitle').textContent=title; $('dialogMessage').textContent=message;
    const dialog=$('saveDialog');
    if(typeof dialog.showModal==='function') dialog.showModal();
    else { dialog.setAttribute('open',''); }
  }
  function closeMessage(){const dialog=$('saveDialog');if(typeof dialog.close==='function' && dialog.open) dialog.close();else dialog.removeAttribute('open');}
  save.addEventListener('click',()=>{
    if(!photo) return;
    const url=URL.createObjectURL(photo), link=document.createElement('a');
    const d=capturedAt || new Date(),z=n=>String(n).padStart(2,'0');
    link.href=url;link.download=`bsky-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.jpg`;
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    showMessage('사진 저장 요청','다운로드를 시작했습니다. 갤러리 또는 내 파일의 다운로드 폴더에서 사진을 확인해 주세요.');
  });
  $('confirmPhoto').addEventListener('click',()=>{closeMessage();statusEl.textContent='갤러리 또는 내 파일의 다운로드 폴더에서 확인해 주세요.';});
  $('closeDialog').addEventListener('click',()=>{closeMessage();reset('');});
  $('saveDialog').addEventListener('cancel',e=>{e.preventDefault();closeMessage();reset('');});
  share.addEventListener('click',async()=>{
    if(!photo) return;
    if(!window.Kakao || !KAKAO_JAVASCRIPT_KEY || KAKAO_JAVASCRIPT_KEY==='여기에_자바스크립트_키'){
      showMessage('카카오톡 공유 설정 필요','사이트 관리자가 카카오 JavaScript 키와 도메인 등록을 완료해야 합니다.');return;
    }
    try{
      if(!Kakao.isInitialized()) Kakao.init(KAKAO_JAVASCRIPT_KEY);
      if(kakaoImageUrl){
        const siteUrl=location.origin+'/';
        Kakao.Share.sendDefault({objectType:'feed',content:{title:'비스카이 사진',imageUrl:kakaoImageUrl,link:{mobileWebUrl:siteUrl,webUrl:siteUrl}}});
        statusEl.textContent='카카오톡에서 공유 대상을 선택해 주세요.';return;
      }
      const selected=photo;
      const transfer=new DataTransfer();transfer.items.add(selected);
      share.disabled=true;share.textContent='공유 준비 중...';
      statusEl.textContent='사진을 카카오 서버에 업로드하고 있습니다.';
      const response=await Kakao.Share.uploadImage({file:transfer.files});
      if(photo!==selected) return;
      kakaoImageUrl=response.infos.original.url;
      share.textContent='카카오톡으로 보내기';
      statusEl.textContent='준비가 완료되었습니다. 카카오톡으로 보내기를 눌러 대화방을 선택해 주세요.';
    } catch(error){
      console.error('카카오 공유 오류',error);
      statusEl.textContent='공유 준비에 실패했습니다. 인터넷 연결과 카카오 앱 키·도메인 설정을 확인해 주세요.';
      share.textContent='카카오톡 공유하기';
    } finally {share.disabled=false;}
  });
  retake.addEventListener('click',()=>reset(''));
  function reset(message){
    kakaoImageUrl=null;share.textContent='카카오톡 공유하기';
    if(photoUrl) URL.revokeObjectURL(photoUrl); photoUrl=null;photo=null;preview.removeAttribute('src');preview.hidden=true;video.hidden=false;
    capture.hidden=false;save.hidden=true;share.hidden=true;retake.hidden=true;input.value='';$('heading').textContent='촬영할 대상을 화면에 맞춰 주세요';
    statusEl.textContent=message;capture.disabled=!stream || !stream.active;
    if(!stream || !stream.active) startCamera();
  }
  async function compress(source,sourceWidth,sourceHeight){
    let maxSide=2400,quality=.86;
    for(let attempt=0;attempt<18;attempt++){
      const scale=Math.min(1,maxSide/Math.max(sourceWidth,sourceHeight));
      const width=Math.max(1,Math.round(sourceWidth*scale)),height=Math.max(1,Math.round(sourceHeight*scale));
      const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.drawImage(source,0,0,width,height);drawLogo(ctx,width,height);
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('JPEG 변환 실패')),'image/jpeg',quality));
      if(blob.size<=MAX_BYTES) return {blob,width,height};
      if(quality>.48) quality-=.08;else{quality=.68;maxSide=Math.round(maxSide*.82);}
    }
    throw new Error('400KB 이하로 압축하지 못했습니다.');
  }
  function drawLogo(ctx,width,height){
    const scale=Math.max(.75,Math.min(width,height)/900),pad=Math.round(18*scale),fontSize=Math.round(27*scale);
    ctx.save();ctx.font=`800 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
    const boxW=ctx.measureText('비스카이').width+pad*1.5,boxH=fontSize+pad,x=Math.round(width*.025),y=Math.round(height*.035),r=Math.round(9*scale);
    ctx.fillStyle='rgba(5,60,163,.88)';ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+boxW,y,x+boxW,y+boxH,r);ctx.arcTo(x+boxW,y+boxH,x,y+boxH,r);ctx.arcTo(x,y+boxH,x,y,r);ctx.arcTo(x,y,x+boxW,y,r);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText('비스카이',x+pad*.75,y+boxH/2+1);
    const d=capturedAt || new Date(), z=n=>String(n).padStart(2,'0');
    const stamp=`${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
    ctx.font=`700 ${Math.max(14,Math.round(25*scale))}px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textBaseline='bottom';ctx.lineWidth=Math.max(3,Math.round(4*scale));ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineJoin='round';
    const tx=Math.round(width*.025),ty=height-Math.round(height*.025);ctx.strokeText(stamp,tx,ty);ctx.fillText(stamp,tx,ty);ctx.restore();
  }
  window.addEventListener('pagehide',()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}});
  window.addEventListener('pageshow',event=>{if(event.persisted && !photo) startCamera();});
  startCamera();
</script>
</body>
</html>
